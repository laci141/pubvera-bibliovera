name: Build and Deploy Bibliovera

# pull_request runs every check below against the proposed change, but never
# publishes an image. Only the publish job holds packages: write, and it runs
# only on push or workflow_dispatch from refs/heads/main. Watchtower on the
# server deploys whatever :latest points at, so a PR that could push :latest
# would deploy unmerged code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Bump this deliberately and read the diff, rather than being bumped by it.
  # Same version as pubvera-recallis and pubvera-grantvera.
  GOVULNCHECK_VERSION: v1.8.0

# One run per workflow and ref. On a pull request a newer push cancels the
# older run: it only proves the change builds. On main runs queue instead of
# being cancelled: a cancelled run could stop mid-push, and queueing makes the
# newest commit the last one to move :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    # Read-only token: this job also runs on pull_request. Only the publish
    # job below, gated on push or workflow_dispatch from main, can write to GHCR.
    permissions:
      contents: read
    steps:
      # No LFS checkout: the two vendored CLI binaries were the only LFS files
      # in the tree, and the image now builds both CLIs from a pinned upstream
      # commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Build, Vet and Gofmt run before Test, as in pubvera-corpova. Test alone
      # let unformatted code and vet findings merge green.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: zero files"

      - name: Test
        run: go test -race ./...

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches. It
      # scans this module only; a CLI built from a pinned upstream commit in the
      # Dockerfile is a separate binary and is not covered.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

      # go test does not run the node tests in tools/; a phase filter bug once
      # stayed live because its JS test only ran locally. "|| exit 1" fails the
      # step on the first failing test without relying on the shell's -e.
      - name: Run JS tests
        run: |
          for t in tools/*_test.js; do echo "== $t"; node "$t" || exit 1; done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image carries the upstream commit its CLIs were built from as the
      # label org.pubvera.cli.commit. On pubvera-recallis that label once
      # shipped EMPTY (an ARG default that never reached the runtime stage)
      # while the build, the tests and the deploy were all green. So this
      # builds the image locally first and compares the label with the commit
      # pinned in the Dockerfile, BEFORE anything is pushed. A mismatch stops
      # the job, so an image that cannot say where its CLIs came from never
      # reaches :latest.
      #
      # The second build below reuses the gha cache this one fills, so the
      # extra cost is the load into the runner's Docker, not a rebuild.
      - name: Build image for the label check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: bibliovera-label-check:ci
          cache-from: type=gha

      - name: Check the CLI commit label
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ARG PP_LIBRARY_COMMIT=//p' Dockerfile)
          actual=$(docker image inspect bibliovera-label-check:ci --format '{{ index .Config.Labels "org.pubvera.cli.commit" }}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Dockerfile has no global 'ARG PP_LIBRARY_COMMIT=<40-hex commit>' line"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "label org.pubvera.cli.commit does not match the commit pinned in the Dockerfile"
            exit 1
          fi
          echo "label matches the pinned commit"

      # The "Vulnerability scan" step above covers this module only. The two
      # CLIs are built in the Dockerfile from a pinned upstream commit, so
      # their dependencies are scanned here as the binaries that actually ship,
      # taken from the image loaded for the label check, BEFORE anything is
      # pushed. No extra build: that image already has load: true.
      - name: Extract CLI binaries from the image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-bin"
          cid=$(docker create bibliovera-label-check:ci)
          trap 'docker rm "$cid" >/dev/null' EXIT
          docker cp "$cid:/app/thelancet" "$RUNNER_TEMP/cli-bin/thelancet"
          docker cp "$cid:/app/retraction-checker" "$RUNNER_TEMP/cli-bin/retraction-checker"
          ls -l "$RUNNER_TEMP/cli-bin"

      # Exit codes: 0 = no vulnerabilities, 3 = vulnerabilities found, anything
      # else = the tool itself failed. Only 0 passes: a scan that did not run is
      # not a clean scan.
      - name: Vulnerability scan (thelancet binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          rc=0
          govulncheck -mode=binary "$RUNNER_TEMP/cli-bin/thelancet" || rc=$?
          case "$rc" in
            0) echo "thelancet: no known vulnerabilities" ;;
            3) echo "thelancet: govulncheck found vulnerabilities"; exit 1 ;;
            *) echo "thelancet: govulncheck failed with exit code $rc - scan did not complete"; exit 1 ;;
          esac

      - name: Vulnerability scan (retraction-checker binary)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          rc=0
          govulncheck -mode=binary "$RUNNER_TEMP/cli-bin/retraction-checker" || rc=$?
          case "$rc" in
            0) echo "retraction-checker: no known vulnerabilities" ;;
            3) echo "retraction-checker: govulncheck found vulnerabilities"; exit 1 ;;
            *) echo "retraction-checker: govulncheck failed with exit code $rc - scan did not complete"; exit 1 ;;
          esac

      # The image is built once and exported as a tar, never pushed from here.
      # The tags are the final GHCR names, so docker load in the publish job
      # restores them as they are.
      - name: Build and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=docker,dest=${{ runner.temp }}/bibliovera-image.tar
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build-push-action@v7 does not accept an image ID file input (it warns
      # "Unexpected input(s)" and writes its own temp file instead), so the ID
      # is read from the exported tar itself. An empty iid.txt fails the step.
      - name: Write image ID
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/bibliovera-image.tar"
          docker image inspect --format '{{.Id}}' "$REGISTRY/$IMAGE_NAME:latest" > "$RUNNER_TEMP/iid.txt"
          test -s "$RUNNER_TEMP/iid.txt"
          echo "build iid: $(cat "$RUNNER_TEMP/iid.txt")"

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bibliovera-image
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bibliovera-image.tar
            ${{ runner.temp }}/iid.txt

  # The only job that can write packages. It runs on push or workflow_dispatch
  # from main only, so :latest (and what Watchtower deploys) only moves on main.
  publish:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bibliovera-image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/bibliovera-image.tar"
          # The digests are printed for the record only and never compared, so
          # they cannot fail the step. The pushes can: with pipefail a failing
          # docker push still fails the step through the tee.
          echo "build iid: $(cat "$RUNNER_TEMP/iid.txt")"
          echo "loaded Id: $(docker image inspect --format '{{.Id}}' "$REGISTRY/$IMAGE_NAME:latest")"
          docker push "$REGISTRY/$IMAGE_NAME:latest" | tee "$RUNNER_TEMP/push-latest.log"
          echo "push latest $(grep -o 'digest: sha256:[0-9a-f]*' "$RUNNER_TEMP/push-latest.log" || echo 'digest: not found in push output')"
          docker push "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}" | tee "$RUNNER_TEMP/push-sha.log"
          echo "push sha $(grep -o 'digest: sha256:[0-9a-f]*' "$RUNNER_TEMP/push-sha.log" || echo 'digest: not found in push output')"
          echo "RepoDigests[0]: $(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE_NAME:latest" || echo 'none')"
